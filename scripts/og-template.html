<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #eef1f4; color: #121b25; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; border-left: 22px solid #e8541e; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; color: #4b5661; display: flex; align-items: center; gap: 14px; }
  .eyebrow i { width: 20px; height: 20px; background: #e8541e; border-radius: 3px; display: inline-block; }
  h1 { font-size: 68px; font-weight: 800; font-stretch: 112%; line-height: 1.04; letter-spacing: -0.015em; margin: 0; max-width: 1000px; text-wrap: balance; }
  p { font-family: "Source Serif 4", Georgia, serif; font-size: 26px; line-height: 1.4; margin: 20px 0 0; max-width: 980px; color: #121b25; }
  .url { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: #4b5661; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow"><i></i>Infrastructure Factory</div>
  <div><h1>{{TITLE}}</h1><p>{{DESC}}</p></div>
  <div class="url">{{PATH}}</div>
</div>
</body>
</html>
